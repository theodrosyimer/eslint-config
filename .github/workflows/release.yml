name: Release and Publish

on:
  workflow_run:
    workflows: ["NPM Package CI"]
    types: [completed]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    # ✅ Only required permissions for trusted publishing
    permissions:
      contents: write # Git operations, create releases
      id-token: write # OIDC for trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Git User
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # ✅ Use Node.js 22.18.0 or greater for guaranteed NPM 11.5.1+ compatibility
          # node-version: '22.18.0' # Latest LTS
          node-version-file: .nvmrc # Use the .nvmrc file to set the Node.js version greater than or equal to 22.18.0
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade to Latest NPM CLI
        run: npm install -g npm@latest

      - name: Verify NPM CLI for Trusted Publishing
        run: |
          npm_version=$(npm --version)
          echo "NPM CLI version: $npm_version"

          # Verify trusted publishing support
          [ "$(printf '%s\n' '11.5.1' "$npm_version" | sort -V | head -n1)" = "11.5.1" ] && {
            echo "✅ NPM CLI $npm_version supports trusted publishing"
          } || {
            echo "❌ Installation of latest NPM failed or version insufficient for trusted publishing"
            echo "❌ Current version: $npm_version (required: 11.5.1+)"
            echo "❌ Try manually upgrading: npm install -g npm@latest"
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release --ci

      - name: Publish
        run: pnpm publish --access public

      - name: Verify Provenance
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "✅ Package published with automatic provenance"
          echo "🔍 Verify at: https://npmjs.com/package/$PACKAGE_NAME"
